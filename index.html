<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubAI - Persian Subtitle Translator</title>
    <meta name="description" content="A professional tool to translate and improve SRT/VTT subtitles into Persian using Google Gemini API." />
    <meta property="og:title" content="SubAI - Persian Subtitle Translator" />
    <meta property="og:description" content="A professional tool to translate and improve SRT/VTT subtitles into Persian using Google Gemini API." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-main)',
              surface: 'var(--bg-surface)',
              surfaceHighlight: 'var(--bg-surface-highlight)',
              border: 'var(--border-color)',
              text: {
                DEFAULT: 'var(--text-main)',
                muted: 'var(--text-muted)'
              },
              primary: 'var(--neon-primary)',
              secondary: 'var(--neon-secondary)'
            }
          }
        }
      }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Montserrat:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">
    
    <style>
      :root {
        /* Dark Mode (Default) */
        --bg-main: #0a0e27;
        --bg-surface: rgba(255, 255, 255, 0.05);
        --bg-surface-highlight: rgba(255, 255, 255, 0.1);
        --bg-elevated: #111936;
        --border-color: #1e2a5e;
        --text-main: #ffffff;
        --text-muted: #a0aec0;
        
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: #1e2a5e;
        --input-bg: #060a20;
        
        --neon-primary: #00f0ff;
        --neon-secondary: #ff00ea;
      }

      :root[data-theme="light"],
      html.light {
        /* Redesigned Modern, Crisp, High-End Light Mode */
        --bg-main: #f8fafc;
        --bg-surface: #ffffff;
        --bg-surface-highlight: #f1f5f9;
        --bg-elevated: #ffffff;
        --border-color: #e2e8f0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --input-bg: #ffffff;
        
        --glass-bg: rgba(255, 255, 255, 0.95);
        --glass-border: #e2e8f0;
        
        --neon-primary: #0284c7;
        --neon-secondary: #c026d3;
      }

      body {
        font-family: 'Vazirmatn', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
        min-height: 100vh;
      }

      /* Dynamic Background Gradient */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
          radial-gradient(circle at 10% 20%, var(--neon-primary) 0%, transparent 20%),
          radial-gradient(circle at 90% 80%, var(--neon-secondary) 0%, transparent 20%);
        opacity: 0.1;
        pointer-events: none;
      }

      :root[data-theme="light"] body::before,
      html.light body::before {
        background-image: 
          radial-gradient(circle at 12% 18%, rgba(14, 165, 233, 0.10) 0%, transparent 35%),
          radial-gradient(circle at 88% 82%, rgba(217, 70, 239, 0.08) 0%, transparent 35%);
        opacity: 1;
      }

      .font-montserrat {
        font-family: 'Montserrat', sans-serif;
      }
      
      /* Glassmorphism Utilities */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-color);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
      }

      :root[data-theme="light"] .glass,
      html.light .glass {
        background: rgba(255, 255, 255, 0.95) !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02) !important;
      }
      
      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-surface);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      :root[data-theme="light"] ::-webkit-scrollbar-track,
      html.light ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      :root[data-theme="light"] ::-webkit-scrollbar-thumb,
      html.light ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
      :root[data-theme="light"] ::-webkit-scrollbar-thumb:hover,
      html.light ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Light Theme Targeted Component Overrides */
      :root[data-theme="light"] .bg-\[\#0a0e27\],
      :root[data-theme="light"] .bg-\[\#060a20\],
      :root[data-theme="light"] .bg-\[\#111936\],
      html.light .bg-\[\#0a0e27\],
      html.light .bg-\[\#060a20\],
      html.light .bg-\[\#111936\] {
        background-color: #ffffff !important;
      }

      :root[data-theme="light"] .bg-\[\#0a0e27\]\/50,
      :root[data-theme="light"] .bg-\[\#0a0e27\]\/60,
      :root[data-theme="light"] .bg-\[\#0a0e27\]\/80,
      :root[data-theme="light"] .bg-\[\#0a0e27\]\/90,
      html.light .bg-\[\#0a0e27\]\/50,
      html.light .bg-\[\#0a0e27\]\/60,
      html.light .bg-\[\#0a0e27\]\/80,
      html.light .bg-\[\#0a0e27\]\/90 {
        background-color: #f8fafc !important;
      }

      :root[data-theme="light"] .bg-\[\#1a2550\],
      :root[data-theme="light"] .bg-\[\#223068\],
      html.light .bg-\[\#1a2550\],
      html.light .bg-\[\#223068\] {
        background-color: #f1f5f9 !important;
      }

      :root[data-theme="light"] .bg-white\/\[0\.03\],
      :root[data-theme="light"] .bg-white\/5,
      :root[data-theme="light"] .bg-white\/10,
      html.light .bg-white\/\[0\.03\],
      html.light .bg-white\/5,
      html.light .bg-white\/10 {
        background-color: #f8fafc !important;
      }

      :root[data-theme="light"] .border-white\/5,
      :root[data-theme="light"] .border-white\/10,
      :root[data-theme="light"] .border-white\/15,
      :root[data-theme="light"] .border-white\/20,
      :root[data-theme="light"] .border-\[\#1e2a5e\],
      :root[data-theme="light"] .border-\[\#24336a\],
      :root[data-theme="light"] .border-\[\#2b3c7e\],
      html.light .border-white\/5,
      html.light .border-white\/10,
      html.light .border-white\/15,
      html.light .border-white\/20,
      html.light .border-\[\#1e2a5e\],
      html.light .border-\[\#24336a\],
      html.light .border-\[\#2b3c7e\] {
        border-color: #e2e8f0 !important;
      }

      :root[data-theme="light"] .text-white,
      html.light .text-white {
        color: #0f172a !important;
      }

      :root[data-theme="light"] .text-white\/90,
      :root[data-theme="light"] .text-white\/80,
      :root[data-theme="light"] .text-white\/70,
      html.light .text-white\/90,
      html.light .text-white\/80,
      html.light .text-white\/70 {
        color: #334155 !important;
      }

      :root[data-theme="light"] .text-white\/60,
      :root[data-theme="light"] .text-white\/50,
      :root[data-theme="light"] .text-white\/40,
      html.light .text-white\/60,
      html.light .text-white\/50,
      html.light .text-white\/40 {
        color: #64748b !important;
      }

      :root[data-theme="light"] .text-white\/30,
      html.light .text-white\/30 {
        color: #94a3b8 !important;
      }

      /* Light Theme Inputs & Labels */
      :root[data-theme="light"] input,
      :root[data-theme="light"] textarea,
      :root[data-theme="light"] select,
      html.light input,
      html.light textarea,
      html.light select {
        background-color: #ffffff !important;
        border-color: #cbd5e1 !important;
        color: #0f172a !important;
      }

      :root[data-theme="light"] input:focus,
      :root[data-theme="light"] textarea:focus,
      :root[data-theme="light"] select:focus,
      html.light input:focus,
      html.light textarea:focus,
      html.light select:focus {
        border-color: #0284c7 !important;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12) !important;
      }

      :root[data-theme="light"] input::placeholder,
      :root[data-theme="light"] textarea::placeholder,
      html.light input::placeholder,
      html.light textarea::placeholder {
        color: #94a3b8 !important;
      }

      :root[data-theme="light"] label.absolute,
      html.light label.absolute {
        background-color: #ffffff !important;
        border-color: #e2e8f0 !important;
      }

      :root[data-theme="light"] .overflow-hidden.h-4.bg-\[\#0a0e27\],
      html.light .overflow-hidden.h-4.bg-\[\#0a0e27\] {
        background-color: #e2e8f0 !important;
        border-color: #cbd5e1 !important;
      }

      /* Method Selector Radios */
      :root[data-theme="light"] [role="radio"][aria-checked="false"],
      html.light [role="radio"][aria-checked="false"] {
        background-color: #ffffff !important;
        border-color: #e2e8f0 !important;
        color: #334155 !important;
      }

      :root[data-theme="light"] [role="radio"][aria-checked="true"],
      html.light [role="radio"][aria-checked="true"] {
        background-color: #f0f9ff !important;
        border-color: #0284c7 !important;
      }

      :root[data-theme="light"] [role="radio"][aria-checked="true"] h5,
      html.light [role="radio"][aria-checked="true"] h5 {
        color: #0369a1 !important;
      }

      :root[data-theme="light"] [role="radio"][aria-checked="true"] p,
      html.light [role="radio"][aria-checked="true"] p {
        color: #0284c7 !important;
      }

      :root[data-theme="light"] .bg-slate-950\/60,
      html.light .bg-slate-950\/60,
      :root[data-theme="light"] .bg-black\/60,
      html.light .bg-black\/60 {
        background-color: rgba(15, 23, 42, 0.35) !important;
      }

      /* Animations */
      @keyframes pulse-neon {
        0%, 100% { box-shadow: 0 0 10px var(--neon-primary); }
        50% { box-shadow: 0 0 20px var(--neon-primary), 0 0 10px var(--neon-secondary); }
      }
      .animate-pulse-neon {
        animation: pulse-neon 2s infinite;
      }

      /* Intelligent Bi-Directional Alignment */
      [dir="auto"],
      input[dir="auto"],
      textarea[dir="auto"] {
        unicode-bidi: plaintext;
        text-align: start;
      }

      /* Placeholder respects element direction & text alignment */
      input::placeholder,
      textarea::placeholder {
        direction: inherit;
        text-align: inherit;
        unicode-bidi: plaintext;
      }

      /* Explicit directional utilities */
      [dir="ltr"],
      .dir-ltr {
        direction: ltr !important;
        text-align: left !important;
      }

      [dir="rtl"],
      .dir-rtl {
        direction: rtl !important;
        text-align: right !important;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
